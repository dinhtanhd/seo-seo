# These maps use the ORIGINAL request URI, never Nginx's decoded/normalized $uri.
map $request $tram_public_origin_form {
    default 0;
    ~^(GET|HEAD)[[:space:]]/ 1;
}
map $request_uri $tram_public_cache_path {
    default "";
    ~*^/(admin|login|logout|api|up|readyz|theme-assets|theme-bundles|robots|sitemap|__tram_ads|__tram_public_cache_policy|__tram_public_html_cache|__tram_public_runtime_html_cache)(/|\.|$) "";
    # Custom advertising scripts are dynamic responses, never HTML projections.
    ~*\.js(?:\?|$) "";
    "~^(/(?:[A-Za-z0-9_-]+(?:/[A-Za-z0-9_-]+)*(?:\.[a-z][a-z0-9]{0,11})?)?)$" $1;
}
# A /index.html URL must not create a directory where the '/' cache file lives.
map $tram_public_cache_path $tram_public_cache_projection_path {
    default $tram_public_cache_path;
    "~\.[a-z][a-z0-9]{0,11}$" "/.suffix$tram_public_cache_path";
}
map $http_user_agent $tram_public_spider_suffix {
    default "";
    ~*Baiduspider|Sogou(?:\s+(?:web|inst|orion))?\s*spider|360Spider|HaosouSpider|YisouSpider|ShenmaSpider .spider;
}
map "$request_method:$http_cookie:$http_authorization:$tram_public_origin_form:$tram_public_cache_path" $tram_public_cache_file {
    default "";
    ~^(GET|HEAD):::1:/ "/$tram_cache_database/$host$tram_public_cache_projection_path/index$tram_public_spider_suffix.html";
}
map $tram_public_cache_file $tram_public_cache_eligible {
    "" 0;
    default 1;
}
map $tram_public_cache_file $tram_public_runtime_cache_file {
    default "";
    ~^(?<tram_public_runtime_cache_prefix>.+)/index(?:\.spider)?\.html$ "$tram_public_runtime_cache_prefix/index.runtime$tram_public_spider_suffix.html";
}
map $tram_public_cache_file $tram_public_advertising_cache_file {
    default "";
    ~^(?<tram_public_advertising_cache_prefix>.+)/index(?:\.spider)?\.html$ "$tram_public_advertising_cache_prefix/index.advertising$tram_public_spider_suffix.html";
}
map $tram_public_cache_file $tram_public_runtime_advertising_cache_file {
    default "";
    ~^(?<tram_public_runtime_advertising_cache_prefix>.+)/index(?:\.spider)?\.html$ "$tram_public_runtime_advertising_cache_prefix/index.runtime.advertising$tram_public_spider_suffix.html";
}
map $scheme $tram_public_hsts {
    default "";
    https "max-age=31536000";
}

# Separate files prevent bot navigation from leaking into the ordinary response.
